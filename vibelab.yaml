    - assets/detail-5.jpg
  videos: []
version:
  name: V1.0.0
  notes: 首个版本：悬浮性能条实时显示 CPU、GPU、网络、电池温度、续航与刷新率；详情窗口提供 60 秒趋势图；新增"表盘"主题，以六个跑车风格 3D 仪表替换性能条，点击任意仪表即可打开详情。
